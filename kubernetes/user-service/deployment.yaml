apiVersion: apps/v1
kind: Deployment

metadata:
  name: user-service
  namespace: cloudops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
        - name: user-service

          image: cloudops-microservice-platform-user-service:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 5001

          envFrom:
            - configMapRef:
                name: cloudops-config

            - secretRef:
                name: cloudops-secret

          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"