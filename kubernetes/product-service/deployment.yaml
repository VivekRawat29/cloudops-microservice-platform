apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: cloudops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: product-service

  template:
    metadata:
      labels:
        app: product-service

    spec:
      containers:
        - name: product-service
          image: cloudops-microservice-platform-product-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 5002

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"