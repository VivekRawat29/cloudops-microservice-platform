version: "3.9"

services:

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway

  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8080:80"
    depends_on:
      - user-service
      - product-service
      - order-service

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "5001:5001"

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "5002:5002"
    environment:
      MONGO_URI: mongodb://mongodb:27017
      DATABASE_NAME: cloudops
      COLLECTION_NAME: products
    depends_on:
      - mongodb

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "5003:5003"
    environment:
      PRODUCT_SERVICE_URL: http://product-service:5002
      MONGO_URI: mongodb://mongodb:27017
      DATABASE_NAME: cloudops
      COLLECTION_NAME: orders
    depends_on:
      - mongodb
      - product-service

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: